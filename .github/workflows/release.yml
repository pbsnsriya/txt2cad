name: Release

# A tag like v0.7.0 (made by scripts/release.py) publishes a GitHub Release, but only after the whole test suite has passed on the tagged commit.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag must match the VERSION file
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)" || { echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: python scripts/release.py --notes "${GITHUB_REF_NAME}" > release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "txt2cad ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag $flags
